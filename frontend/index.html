<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b45309" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kavipushp" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Kavipushp Billing Software</title>
    <meta name="description" content="Complete billing, inventory, and business management software for MSMEs" />
    <script>
      // Purge any legacy service worker + caches so the app can never be pinned
      // to a stale build. Runs once (guarded against reload loops); no SW is
      // registered anymore, so after one cleanup this is a no-op.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
            }
            if (!sessionStorage.getItem('sw-purged')) {
              sessionStorage.setItem('sw-purged', '1');
              location.reload();
            }
          });
        }).catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
